version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindecho-backend
    restart: unless-stopped
    volumes:
      # Data SQLite tersimpan aman di host server
      - ./data:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/mindecho.db
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    container_name: mindecho-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
